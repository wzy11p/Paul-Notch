name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test
        run: |
          test_data=$(mktemp -d /tmp/paul-ci-tests.XXXXXX)
          PAUL_PREVIEW_DIRECTORY="$test_data" swift test
      - name: Safety fallback
        run: zsh scripts/test-safety.sh
      - name: Public boundaries
        run: zsh scripts/test-public-boundaries.sh
      - name: Public runtime compatibility
        run: |
          zsh scripts/test-public-runtime.sh
          zsh scripts/test-public-custom-quota.sh
      - name: Quota model and reset boundaries
        run: |
          zsh scripts/test-quota-layout.sh
          zsh scripts/test-desktop-quota.sh
          zsh scripts/test-muse-quota.sh
          zsh scripts/test-time-plan.sh
      - name: Build 109 quota and model regressions
        run: |
          zsh scripts/test-codex-recovery.sh
          zsh scripts/test-custom-quota.sh
          zsh scripts/test-cursor-model-context.sh
          zsh scripts/test-quota-card-visibility.sh
          zsh scripts/test-quota-connections.sh
          swiftc -swift-version 6 -parse-as-library Sources/PaulNotchCore/QuotaConnectionModels.swift Sources/PaulNotchCore/QuotaResetReminderPolicy.swift Tests/QuotaOverview/QuotaResetNoticeValidation.swift -o "$RUNNER_TEMP/reset-policy"
          "$RUNNER_TEMP/reset-policy"
